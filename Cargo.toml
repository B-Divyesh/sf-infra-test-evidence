[package]
name = "infra-test-evidence"
version = "0.1.0"
edition = "2024"
description = "Convert OpenTofu/Terraform test JSON into JUnit and redacted evidence"
license = "MIT"
readme = "README.md"
repository = "https://github.com/B-Divyesh/sf-infra-test-evidence"
keywords = ["infrastructure", "testing", "evidence", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = ["dist/", "node_modules/", "playwright-report/", "test-results/"]

[[bin]]
name = "infra-test-evidence"
path = "src-rust/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
